[project]
name = "customer-support-analytics"
version = "2.2.0"
description = "Support analytics for any community or helpdesk: contacts, business-hours response times, SLA, open-chat queue, topics, upgrades and revenue, with bring-your-own-data import and a dashboard."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Nada Shaban" }]
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "pydantic>=2.7", "pydantic-settings>=2.3", "tzdata>=2024.1"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "httpx>=0.27", "ruff>=0.6", "mypy>=1.10"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["support_analytics*"]

[tool.setuptools.package-data]
"support_analytics.ingest" = ["bot_patterns.txt"]
"support_analytics.eval" = ["scenarios/*.json", "topics_labeled.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --import-mode=importlib"

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
